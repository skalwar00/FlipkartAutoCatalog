kind = "web"
previewPath = "/"
title = "Flipkart Catalog Mapper"
version = "1.0.0"
id = "artifacts/flipkart-catalog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25993

[services.development]
run = "pnpm --filter @workspace/flipkart-catalog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flipkart-catalog", "run", "build" ]
publicDir = "artifacts/flipkart-catalog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25993"
BASE_PATH = "/"
